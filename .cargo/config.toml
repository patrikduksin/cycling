# No target rustflags: devices/c606/build.rs adds the linker script, and repeated
# flags here break nested checkouts. esp-backtrace needs no frame pointers on
# Xtensa; it walks the windowed-ABI save areas.

[unstable]
build-std = ["core", "alloc"]

[env]
# Frames esp-backtrace walks; the panic record keeps up to 24 (device_api::crash::FRAMES).
ESP_BACKTRACE_CONFIG_BACKTRACE_FRAMES = "24"
