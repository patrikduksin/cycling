[test-groups]
slow = { max-threads = "num-cpus" }

[[profile.default.overrides]]
filter = """
test(=a_two_hour_ride_with_a_pause_replays_exactly)
| test(=no_turn_back_when_riding_home_in_the_dark_or_with_sunset_off)
| test(=riding_out_toward_dusk_says_when_to_turn_back)
| test(=the_battery_estimate_shows_on_ready_and_warns_during_a_fast_drain)
| test(=a_five_hour_track_on_the_card_reads_back_after_a_restart)
| test(=every_dark_screen_reads_the_same_through_the_light_look)
| test(=benchmark_screens_paint_their_recorded_pixels)
| test(=riding_into_dusk_warns_before_sunset_and_again_at_sunset)
| test(=riding_round_a_loop_never_says_turn_back_on_the_last_leg)
| test(=navigation::arriving_shows_the_ride_totals_for_a_minute)
| test(=no_turn_back_when_stopping_on_the_way_home)
| test(=bulk_media_keeps_a_long_ride_through_power_loss)
"""
test-group = "slow"
priority = 100

[[profile.default.overrides]]
filter = """
test(/::share_[0-7]$/)
| test(=pause_excludes_time_and_two_hour_ride_keeps_every_sample)
| test(=heart_rate_band_and_eat_and_drink_alerts_sound_and_show)
| test(=every_sensor_input_mutated_shows_in_its_replay)
| test(=store::tests::every_power_cut_keeps_whole_files_and_their_synced_bytes)
| test(=ride::course::turns::tests::a_recorded_track_names_its_turns_no_worse_than_the_course_as_kept)
| test(=ride::course::follow::tests::noisy_fixes_round_a_roundabout_never_give_a_wrong_word)
"""
test-group = "slow"
priority = 50

[profile.without-ride-scenarios]
default-filter = "not binary(ride_scenarios)"
