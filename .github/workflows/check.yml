name: check

# PRs are verified locally (test, check, simulate, harness-virtual and the
# firmware build) with the results posted on the PR. CI runs once per push to
# main as a backstop, or on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
      - run: nix develop -c cycling test
      - run: nix develop -c cycling check
      - run: nix develop -c cycling simulate
      - run: nix develop -c cycling harness-virtual
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
      - run: nix develop -c cycling build
