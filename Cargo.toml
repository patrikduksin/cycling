[workspace]
members = ["packages/device-api", "packages/services", "packages/shell", "packages/console", "apps/vana", "devices/c606", "tools/simulator"]
default-members = ["packages/device-api", "packages/services", "packages/shell", "packages/console", "apps/vana", "tools/simulator"]
exclude = ["vendor/trouble-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/patrikduksin/cycling"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = true

[patch.crates-io]
trouble-host = { path = "vendor/trouble-host" }

esp-hal = { git = "https://github.com/patrikduksin/esp-hal.git", rev = "0cf3835559c18f03d75190b332316ba85b68b8ed" }
