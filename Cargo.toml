[workspace]
members = ["packages/capability", "packages/device-api", "packages/services", "packages/terrain", "packages/shell", "packages/console", "apps/vana", "devices/c606", "tools/simulator"]
default-members = ["packages/capability", "packages/device-api", "packages/services", "packages/terrain", "packages/shell", "packages/console", "apps/vana", "tools/simulator"]
exclude = ["vendor/trouble-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/patrikduksin/cycling"

[workspace.dependencies]
# Match the version Embassy and the radio stacks already pull in.
heapless = { version = "=0.9.3", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = true

[profile.tools]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
debug = "line-tables-only"
panic = "unwind"

[patch.crates-io]
trouble-host = { path = "vendor/trouble-host" }

esp-hal = { git = "https://github.com/patrikduksin/esp-hal.git", rev = "3dc1a1d25071acb0993a79cd4d1083e1253cdea0" }
xtensa-lx-rt = { git = "https://github.com/patrikduksin/esp-hal.git", rev = "3dc1a1d25071acb0993a79cd4d1083e1253cdea0" }

# Simulated scenarios run hours of firmware passes; keep host tests fast.
[profile.dev.package.shell-simulator]
opt-level = 2
[profile.dev.package.vana]
opt-level = 2
[profile.dev.package.firmware-shell]
opt-level = 2
[profile.dev.package.firmware-services]
opt-level = 2
[profile.dev.package.terrain]
opt-level = 2
[profile.dev.package.libm]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.fdeflate]
opt-level = 2
[profile.dev.package.flate2]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 2
[profile.dev.package.adler2]
opt-level = 2
[profile.dev.package.simd-adler32]
opt-level = 2
