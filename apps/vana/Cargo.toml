[package]
name = "vana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Cargo passes build-script metadata to immediate dependents only as
# DEP_<links>_<KEY>. VANA links no native library; the key gives the
# simulator's and c606's build scripts DEP_VANA_FEATURES.
links = "vana"

[features]
default = []
planted-bug = []
planted-reading-bug = []
invariants = ["firmware-shell/tall"]
testing = []

[dependencies]
device-api = { path = "../../packages/device-api" }
firmware-shell = { path = "../../packages/shell" }
firmware-services = { path = "../../packages/services" }
terrain = { path = "../../packages/terrain" }
wamr = { path = "../../packages/wamr" }
heapless.workspace = true
libm = "0.2.16"
log = { version = "=0.4.35", default-features = false }

[dev-dependencies]
firmware-services = { path = "../../packages/services", features = ["testing"] }
firmware-shell = { path = "../../packages/shell", features = ["tall"] }
