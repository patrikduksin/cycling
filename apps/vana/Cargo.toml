[package]
name = "vana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# A deliberate recovery bug the fuzzer must find (tools/simulator/tests/fuzz_planted.rs).
planted-bug = []

[dependencies]
device-api = { path = "../../packages/device-api" }
firmware-shell = { path = "../../packages/shell" }
firmware-services = { path = "../../packages/services" }
terrain = { path = "../../packages/terrain" }
heapless.workspace = true
libm = "0.2.16"
qrcodegen-no-heap = "=1.8.1"
log = { version = "=0.4.35", default-features = false }

[dev-dependencies]
firmware-services = { path = "../../packages/services", features = ["testing"] }
