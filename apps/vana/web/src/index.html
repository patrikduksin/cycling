<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>VANA</title>
<style>
:root {
  --black: #000; --white: #fff; --secondary: #8e8e93; --muted: #aeaeb2; --tertiary: #48484a;
  --card: #1c1c1e; --raised: #2c2c2e; --accent: #0a84ff; --green: #30d158; --amber: #ff9f0a;
  --red: #ff453a; --speed: #64d2ff; --power: #ffd60a; --heart: #ff375f; --cadence: #30d158;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--black); color: var(--white); }
body {
  font-family: ui-rounded, "SF Pro Rounded", Nunito, system-ui, -apple-system, sans-serif;
  font-weight: 700; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto;
}
h1 { font-size: 34px; font-weight: 900; letter-spacing: .5px; margin: 8px 0 2px; }
.caption { font-size: 13px; font-weight: 800; color: var(--secondary); text-transform: uppercase; letter-spacing: .6px; }
.status { display: flex; gap: 16px; flex-wrap: wrap; margin: 4px 0 20px; }
.card { background: var(--card); border-radius: 18px; padding: 16px; margin: 0 0 8px; }
.ride-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ride-date { font-size: 18px; }
.metrics { display: flex; gap: 20px; margin: 10px 0 12px; flex-wrap: wrap; }
.value { font-size: 29px; font-weight: 700; line-height: 1; }
.unit { font-size: 13px; font-weight: 800; color: var(--secondary); margin-left: 4px; }
.badges { display: flex; gap: 6px; }
.badge { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }
a.button, button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--raised); color: var(--white); border: 0; border-radius: 12px;
  font: inherit; font-size: 18px; padding: 12px 18px; text-decoration: none; cursor: pointer;
}
a.button.primary { background: var(--accent); }
a.button.disabled { opacity: .4; pointer-events: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=datetime-local] {
  background: var(--raised); color: var(--white); border: 0; border-radius: 12px;
  font: inherit; font-size: 16px; padding: 10px 12px; color-scheme: dark;
}
.note { color: var(--secondary); font-size: 15px; font-weight: 700; line-height: 1.35; margin: 8px 0; }
.empty { color: var(--secondary); text-align: center; padding: 40px 0; }
.warn { color: var(--amber); }
.alert { color: var(--red); }
footer { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; }
a.back { color: var(--accent); text-decoration: none; font-size: 17px; display: inline-block; margin: 4px 0 8px; }
.open { display: block; color: inherit; text-decoration: none; }
.hint { display: block; margin-bottom: 12px; color: var(--accent); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; margin: 8px 0 4px; }
.grid .value { font-size: 26px; }
.grid .caption { display: block; margin-top: 4px; font-size: 12px; }
.seg { display: inline-flex; background: var(--raised); border-radius: 10px; padding: 2px; }
.seg button { background: none; font-size: 14px; padding: 6px 12px; border-radius: 8px; color: var(--secondary); }
.seg button.on { background: var(--card); color: var(--white); }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.chart-head .read { font-size: 15px; }
canvas { display: block; width: 100%; touch-action: pan-y; }
.axis { display: flex; justify-content: space-between; margin: 2px 4px 8px; }
.zones { display: flex; height: 10px; gap: 2px; margin: 10px 0 8px; }
.zones i { display: block; border-radius: 3px; min-width: 2px; }
.zrow { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 2px 0; }
.zrow .badge { flex: none; }
.zrow b { flex: 1; font-weight: 700; color: var(--muted); }
svg { display: block; width: 100%; height: auto; max-height: 340px; }
</style>
</head>
<body>
<h1>VANA</h1>
<div class="status caption" id="status">Connecting…</div>
<div id="list"><div class="empty caption">Loading rides…</div></div>
<footer>
  <span class="caption" id="foot"></span>
  <button id="done" type="button">Done</button>
</footer>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const token = params.get('t') || sessionStorage.getItem('vana-token') || '';
if (params.get('t')) {
  sessionStorage.setItem('vana-token', token);
  history.replaceState(null, '', '/');
}
const $ = (id) => document.getElementById(id);

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: { 'X-Session': token }, cache: 'no-store' });
  if (response.status === 401) throw new Error('This session ended. Open Connect phone on the device and scan again.');
  if (!response.ok && response.status !== 204) throw new Error(`Device answered ${response.status}`);
  return response.status === 204 ? null : response.json();
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}

function duration(seconds) {
  const h = Math.floor(seconds / 3600), m = Math.floor(seconds / 60) % 60, s = seconds % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}

function when(start) {
  if (start == null) return 'No date recorded';
  return new Date(start * 1000).toLocaleString(undefined, {
    weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
  });
}

function metric(value, unit, color) {
  return el('div', {}, el('span', { class: 'value', style: `color:${color}` }, value), el('span', { class: 'unit' }, unit));
}

function rideCard(ride) {
  const url = `/api/activities/${ride.id}.fit`;
  const actions = el('div', { class: 'row' });
  if (ride.start == null) {
    const input = el('input', { type: 'datetime-local' });
    const link = el('a', { class: 'button primary' }, 'Download .fit');
    const update = () => {
      const start = Math.floor(new Date(input.value).getTime() / 1000);
      const valid = Number.isFinite(start);
      link.classList.toggle('disabled', !valid);
      if (valid) link.href = `${url}?start=${start}`;
      else link.removeAttribute('href');
    };
    input.addEventListener('input', update);
    update();
    actions.append(el('div', { class: 'note' }, 'This ride has no date: no Wi-Fi time or GPS fix reached it. When did it start?'), input, link);
  } else {
    actions.append(el('a', { class: 'button primary', href: url, download: '' }, 'Download .fit'));
  }
  const dot = (on, color) => el('span', { class: 'badge', style: `background:${on ? color : 'var(--tertiary)'}` });
  return el('div', { class: 'card' },
    el('a', { class: 'open', href: `#/ride/${ride.id}` },
      el('div', { class: 'ride-top' },
        el('span', { class: 'ride-date' }, when(ride.start)),
        el('span', { class: 'badges', title: 'GPS · power · heart rate' },
          dot(ride.gps, 'var(--white)'), dot(ride.power, 'var(--power)'), dot(ride.heart, 'var(--heart)'))),
      el('div', { class: 'metrics' },
        metric(duration(ride.duration_s), 'TIME', 'var(--white)'),
        ride.distance_m == null ? '' : metric((ride.distance_m / 1000).toFixed(1), 'KM', 'var(--white)')),
      el('span', { class: 'hint' }, 'Charts and analysis ›')),
    ride.end === 'recovered' ? el('div', { class: 'note warn' }, 'Recovered after power loss') : '',
    actions);
}

// ---- FIT reader: record messages only (global 20), little or big endian.
const SEMI = 180 / 2 ** 31;
function readFit(buffer) {
  const dv = new DataView(buffer);
  const end = Math.min(dv.byteLength, dv.getUint8(0) + dv.getUint32(4, true));
  const defs = [], rows = [];
  let pos = dv.getUint8(0);
  while (pos < end) {
    const h = dv.getUint8(pos++);
    if (h & 0x80) {
      const d = defs[(h >> 5) & 3];
      if (!d) break;
      pos += d.size;
    } else if (h & 0x40) {
      const le = dv.getUint8(pos + 1) === 0;
      const global = dv.getUint16(pos + 2, le), n = dv.getUint8(pos + 4);
      pos += 5;
      const fields = [];
      let size = 0;
      for (let i = 0; i < n; i++, pos += 3) {
        fields.push([dv.getUint8(pos), dv.getUint8(pos + 1), dv.getUint8(pos + 2) & 31, size]);
        size += dv.getUint8(pos + 1);
      }
      if (h & 0x20) {
        const dn = dv.getUint8(pos++);
        for (let i = 0; i < dn; i++) size += dv.getUint8(pos + i * 3 + 1);
        pos += dn * 3;
      }
      defs[h & 15] = { global, fields, size, le };
    } else {
      const d = defs[h & 15];
      if (!d) break;
      if (d.global === 20) {
        const row = {};
        for (const [num, len, type, off] of d.fields) {
          const at = pos + off;
          let v = NaN;
          // Types: 1 sint8, 3 sint16, 5 sint32 (signed); 0 enum, 2 uint8, 4 uint16, 6 uint32 (unsigned).
          if (len === 1) v = type === 1 ? dv.getInt8(at) : dv.getUint8(at);
          else if (len === 2) v = type === 3 ? dv.getInt16(at, d.le) : dv.getUint16(at, d.le);
          else if (len === 4) v = type === 5 ? dv.getInt32(at, d.le) : dv.getUint32(at, d.le);
          const bad = len === 1 ? (type === 1 ? 0x7f : 0xff) : len === 2 ? (type === 3 ? 0x7fff : 0xffff)
            : len === 4 ? (type === 5 ? 0x7fffffff : 0xffffffff) : 0;
          row[num] = v === bad ? NaN : v;
        }
        rows.push(row);
      }
      pos += d.size;
    }
  }
  const n = rows.length;
  const col = (num, scale = 1, shift = 0) => Float32Array.from(rows, (r) => (r[num] ?? NaN) / scale + shift);
  const t = new Float32Array(n);
  const stamp = rows.map((r) => r[253]);
  for (let i = 0; i < n; i++) t[i] = Number.isFinite(stamp[i]) && Number.isFinite(stamp[0]) ? stamp[i] - stamp[0] : i;
  const altitude = col(78, 5, -500), low = col(2, 5, -500);
  for (let i = 0; i < n; i++) if (Number.isNaN(altitude[i])) altitude[i] = low[i];
  const lat = col(0, 1 / SEMI), lon = col(1, 1 / SEMI);
  return {
    n, t, lat, lon, altitude,
    dist: col(5, 100000), // km
    speed: col(6, 1000 / 3.6), // km/h
    power: col(7), heart: col(3), cadence: col(4), grade: col(9, 100),
  };
}

// ---- Analysis
const finite = (a) => Array.from(a).filter(Number.isFinite);
const mean = (a) => { const f = finite(a); return f.length ? f.reduce((x, y) => x + y, 0) / f.length : NaN; };
const peak = (a) => { const f = finite(a); return f.length ? Math.max(...f) : NaN; };

// Power on a 1 s grid, holding the last reading and counting gaps as zero.
function grid(ride) {
  const total = Math.max(0, Math.round(ride.t[ride.n - 1] || 0)) + 1;
  const out = new Float32Array(total);
  let j = 0;
  for (let s = 0; s < total; s++) {
    while (j + 1 < ride.n && ride.t[j + 1] <= s) j++;
    out[s] = ride.power[j] || 0;
  }
  return out;
}

const CURVE_SPANS = [1, 5, 10, 30, 60, 300, 600, 1200, 3600];
function powerCurve(watts) {
  const sums = new Float64Array(watts.length + 1);
  for (let i = 0; i < watts.length; i++) sums[i + 1] = sums[i] + watts[i];
  const out = [];
  for (const span of CURVE_SPANS) {
    if (span > watts.length) break;
    let best = 0;
    for (let i = span; i <= watts.length; i++) best = Math.max(best, sums[i] - sums[i - span]);
    out.push([span, best / span]);
  }
  return out;
}

function normalized(watts) {
  if (watts.length < 30) return NaN;
  let sum = 0, run = 0, count = 0;
  for (let i = 0; i < watts.length; i++) {
    run += watts[i] - (i >= 30 ? watts[i - 30] : 0);
    if (i >= 29) { sum += (run / 30) ** 4; count++; }
  }
  return (sum / count) ** 0.25;
}

// Ascent with a 2 m hysteresis, so barometer noise does not add up.
function ascent(altitude) {
  let up = 0, ref = NaN;
  for (const a of altitude) {
    if (!Number.isFinite(a)) continue;
    if (Number.isNaN(ref)) ref = a;
    if (a > ref + 2) { up += a - ref; ref = a; } else if (a < ref - 2) ref = a;
  }
  return up;
}

// Lower bounds as a percentage of FTP (power) or LTHR (heart rate), as the device counts them.
const POWER_ZONES = [0, 55, 75, 90, 105, 120, 150];
const HEART_ZONES = [0, 81, 90, 94, 100];
const ZONE_COLORS = ['#8e8e93', '#0a84ff', '#30d158', '#ffd60a', '#ff9f0a', '#ff453a', '#bf5af2'];

function zoneSeconds(values, bounds, base) {
  const seconds = new Array(bounds.length).fill(0);
  for (const v of values) {
    if (!Number.isFinite(v)) continue;
    let z = 0;
    // Power zones start above their bound, heart zones at it.
    while (z + 1 < bounds.length && (bounds === POWER_ZONES ? v > Math.round(base * bounds[z + 1] / 100) : v >= Math.round(base * bounds[z + 1] / 100))) z++;
    seconds[z]++;
  }
  return seconds;
}

// ---- Drawing
const CHARTS = [
  ['speed', 'Speed', 'KM/H', '--speed', 1],
  ['power', 'Power', 'W', '--power', 0],
  ['heart', 'Heart rate', 'BPM', '--heart', 0],
  ['cadence', 'Cadence', 'RPM', '--cadence', 0],
  ['altitude', 'Altitude', 'M', '--amber', 1],
  ['grade', 'Grade', '%', '--amber', 1],
];
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fixed = (v) => (Number.isFinite(v) ? `${Math.round(v)}` : '–');

function canvasFor(node, height) {
  const ratio = window.devicePixelRatio || 1, w = node.clientWidth;
  node.width = Math.round(w * ratio);
  node.height = Math.round(height * ratio);
  const ctx = node.getContext('2d');
  ctx.scale(ratio, ratio);
  return [ctx, w, height];
}

// One column of values per pixel: the mean of what falls in it.
function columns(xs, ys, w) {
  const x0 = xs[0], span = (xs[xs.length - 1] - x0) || 1;
  const sum = new Float64Array(w), count = new Uint16Array(w);
  for (let i = 0; i < xs.length; i++) {
    if (!Number.isFinite(ys[i]) || !Number.isFinite(xs[i])) continue;
    const c = Math.min(w - 1, Math.floor((xs[i] - x0) / span * w));
    sum[c] += ys[i]; count[c]++;
  }
  return Float32Array.from(sum, (s, c) => (count[c] ? s / count[c] : NaN));
}

function lineChart(node, xs, ys, color, floor, cursor) {
  const [ctx, w, h] = canvasFor(node, 96);
  const cols = columns(xs, ys, w), f = finite(cols);
  if (!f.length) return cols;
  let lo = Math.min(...f), hi = Math.max(...f);
  if (floor === 0) lo = Math.min(lo, 0);
  if (hi - lo < 1) hi = lo + 1;
  const pad = 14, y = (v) => h - 2 - (v - lo) / (hi - lo) * (h - 2 - pad);
  ctx.strokeStyle = css('--raised'); ctx.lineWidth = 1;
  for (const g of [0, .5, 1]) { const gy = Math.round(h - 2 - g * (h - 2 - pad)) + .5; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }
  ctx.fillStyle = css('--secondary'); ctx.font = '700 11px system-ui'; ctx.textAlign = 'right';
  ctx.fillText(Math.round(hi), w - 2, 10);
  ctx.strokeStyle = css(color); ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
  const fill = ctx.createLinearGradient(0, pad, 0, h);
  fill.addColorStop(0, css(color) + '55'); fill.addColorStop(1, css(color) + '00');
  let open = false, last = 0;
  const close = () => {
    if (!open) return;
    ctx.stroke();
    ctx.lineTo(last, h); ctx.lineTo(first, h); ctx.fillStyle = fill; ctx.fill(); open = false;
  };
  let first = 0;
  for (let c = 0; c < w; c++) {
    if (Number.isNaN(cols[c])) { close(); continue; }
    if (!open) { ctx.beginPath(); ctx.moveTo(c, y(cols[c])); first = c; open = true; } else ctx.lineTo(c, y(cols[c]));
    last = c;
  }
  close();
  return cols;
}

function paintCursor(node, cursor) {
  if (cursor == null) return;
  const ctx = node.getContext('2d'), ratio = node.width / node.clientWidth;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  const x = Math.round(cursor * (node.clientWidth - 1)) + .5;
  ctx.strokeStyle = css('--white'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 96); ctx.stroke();
}

function curveChart(node, curve, ftp) {
  const [ctx, w, h] = canvasFor(node, 150);
  const left = 34, bottom = 18, top = 8, right = 10;
  const hi = Math.max(...curve.map((c) => c[1]), ftp || 0) * 1.08 || 1;
  const x = (s) => left + Math.log(s) / Math.log(CURVE_SPANS[CURVE_SPANS.length - 1]) * (w - left - right);
  const y = (v) => h - bottom - v / hi * (h - bottom - top);
  ctx.font = '700 11px system-ui'; ctx.fillStyle = css('--secondary'); ctx.strokeStyle = css('--raised'); ctx.lineWidth = 1;
  ctx.textAlign = 'right';
  for (const g of [0, .5, 1]) {
    const v = g * hi, gy = Math.round(y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(left, gy); ctx.lineTo(w, gy); ctx.stroke();
    ctx.fillText(Math.round(v), left - 5, gy + 4);
  }
  ctx.textAlign = 'center';
  const names = { 1: '1s', 5: '5s', 10: '10s', 30: '30s', 60: '1m', 300: '5m', 600: '10m', 1200: '20m', 3600: '1h' };
  for (const s of CURVE_SPANS) if (s !== 10 && s !== 600) ctx.fillText(names[s], x(s), h - 4);
  if (ftp) {
    ctx.setLineDash([4, 4]); ctx.strokeStyle = css('--tertiary');
    ctx.beginPath(); ctx.moveTo(left, y(ftp)); ctx.lineTo(w, y(ftp)); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle = css('--power'); ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  curve.forEach(([s, v], i) => (i ? ctx.lineTo(x(s), y(v)) : ctx.moveTo(x(s), y(v))));
  ctx.stroke();
  ctx.fillStyle = css('--power');
  for (const [s, v] of curve) { ctx.beginPath(); ctx.arc(x(s), y(v), 3, 0, 7); ctx.fill(); }
}

const SVG = 'http://www.w3.org/2000/svg';
function trackSvg(ride) {
  const pts = [];
  for (let i = 0; i < ride.n; i++) if (Number.isFinite(ride.lat[i]) && Number.isFinite(ride.lon[i])) pts.push([i, ride.lat[i], ride.lon[i]]);
  if (pts.length < 2) return null;
  const k = Math.cos(pts[0][1] * Math.PI / 180);
  const xs = pts.map((p) => p[2] * k), ys = pts.map((p) => -p[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), span = Math.max(Math.max(...xs) - x0, Math.max(...ys) - y0) || 1e-6;
  const W = 300, m = 14, s = (W - 2 * m) / span;
  const w = (Math.max(...xs) - x0) * s + 2 * m, h = (Math.max(...ys) - y0) * s + 2 * m;
  const at = pts.map((p, i) => [m + (xs[i] - x0) * s, m + (ys[i] - y0) * s, p[0]]);
  const step = Math.ceil(at.length / 700);
  const line = at.filter((_, i) => i % step === 0 || i === at.length - 1).map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w.toFixed(0)} ${h.toFixed(0)}`);
  const add = (tag, attrs) => { const n = document.createElementNS(SVG, tag); for (const a in attrs) n.setAttribute(a, attrs[a]); svg.append(n); return n; };
  add('polyline', { points: line, fill: 'none', stroke: css('--speed'), 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  add('circle', { cx: at[0][0], cy: at[0][1], r: 5, fill: css('--green') });
  add('circle', { cx: at[at.length - 1][0], cy: at[at.length - 1][1], r: 5, fill: css('--red') });
  const dot = add('circle', { r: 6, fill: css('--white'), stroke: '#000', 'stroke-width': 2, visibility: 'hidden' });
  svg.mark = (index) => {
    if (index == null) return dot.setAttribute('visibility', 'hidden');
    let best = at[0];
    for (const p of at) if (Math.abs(p[2] - index) < Math.abs(best[2] - index)) best = p;
    dot.setAttribute('cx', best[0]); dot.setAttribute('cy', best[1]); dot.setAttribute('visibility', 'visible');
  };
  return svg;
}

let profile = null;
async function profileOf() {
  profile ??= await api('/api/status').catch(() => ({ ftp: 0, lthr: 0 }));
  return profile;
}

function stat(value, unit, color = 'var(--white)') {
  return el('div', {}, el('span', { class: 'value', style: `color:${color}` }, value), el('span', { class: 'unit' }, unit));
}
function stats(items) {
  return el('div', { class: 'grid' }, items.map(([v, caption, color]) =>
    el('div', {}, el('span', { class: 'value', style: `color:${color || 'var(--white)'}` }, v), el('span', { class: 'caption' }, caption))));
}

function zoneCard(title, seconds, names, colors) {
  const total = seconds.reduce((a, b) => a + b, 0);
  if (!total) return '';
  return el('div', { class: 'card' }, el('div', { class: 'caption' }, title),
    el('div', { class: 'zones' }, seconds.map((s, i) => (s ? el('i', { style: `flex:${s};background:${colors[i]}` }) : ''))),
    seconds.map((s, i) => (s ? el('div', { class: 'zrow' }, el('span', { class: 'badge', style: `background:${colors[i]}` }),
      el('b', {}, names[i]), el('span', {}, duration(s)), el('span', { class: 'unit', style: 'width:38px;text-align:right' }, `${Math.round(100 * s / total)}%`)) : '')));
}

async function showRide(id) {
  const root = el('div', {}, el('a', { class: 'back', href: '#/' }, '‹ Rides'), el('div', { class: 'empty caption' }, 'Reading ride…'));
  $('list').replaceChildren(root);
  $('foot').textContent = '';
  let ride, me;
  try {
    me = await profileOf();
    const response = await fetch(`/api/activities/${id}.fit`, { headers: { 'X-Session': token }, cache: 'no-store' });
    if (response.status === 401) throw new Error('This session ended. Open Connect phone on the device and scan again.');
    if (!response.ok) throw new Error(`Device answered ${response.status}`);
    ride = readFit(await response.arrayBuffer());
    if (ride.n < 2) throw new Error('This ride has no records yet.');
  } catch (error) {
    root.replaceChildren(el('a', { class: 'back', href: '#/' }, '‹ Rides'), el('div', { class: 'note alert' }, error.message));
    return;
  }
  const info = rides.find((r) => r.id === id);
  const seconds = ride.t[ride.n - 1];
  const km = finite(ride.dist).pop();
  const watts = grid(ride), np = normalized(watts), ftp = me.ftp, lthr = me.lthr;
  const hasPower = finite(ride.power).length > 0;
  const items = [[duration(Math.round(seconds)), 'Time'], [Number.isFinite(km) ? km.toFixed(1) : '–', 'Km']];
  if (finite(ride.speed).length) items.push([mean(ride.speed).toFixed(1), 'Avg km/h', 'var(--speed)']);
  if (hasPower) items.push([fixed(mean(ride.power)), 'Avg W', 'var(--power)']);
  if (finite(ride.heart).length) items.push([fixed(mean(ride.heart)), 'Avg bpm', 'var(--heart)']);
  if (finite(ride.altitude).length) items.push([fixed(ascent(ride.altitude)), 'Ascent m', 'var(--amber)']);
  const cards = [el('div', { class: 'card' },
    el('div', { class: 'caption' }, info ? when(info.start) : 'Ride'), stats(items),
    el('div', { class: 'row', style: 'margin-top:8px' }, el('a', { class: 'button', href: `/api/activities/${id}.fit`, download: '' }, 'Download .fit')))];
  if (hasPower && Number.isFinite(np) && ftp) {
    const factor = np / ftp;
    cards.push(el('div', { class: 'card' }, el('div', { class: 'caption' }, `Training load · FTP ${ftp} W`),
      stats([[Math.round(np), 'NP W', 'var(--power)'], [factor.toFixed(2), 'IF'], [Math.round(watts.length * np * factor / (ftp * 36)), 'TSS']])));
  }

  // Charts over time or distance, with one shared cursor.
  const axis = { by: 'time' };
  const live = CHARTS.filter(([key]) => finite(ride[key]).length > 1)
    .filter(([key]) => key !== 'grade' || !finite(ride.altitude).length);
  const panels = live.map(([key, name, unit, color, floor]) => {
    const node = el('canvas', {}), read = el('span', { class: 'read', style: `color:var(${color})` });
    const p = { key, node, read, unit, color, floor, cols: null, name };
    p.box = el('div', { class: 'card' },
      el('div', { class: 'chart-head' }, el('span', { class: 'caption' }, `${name} · ${unit}`), read), node);
    return p;
  });
  const left = el('span', { class: 'caption' }), mid = el('span', { class: 'caption' }), right = el('span', { class: 'caption' });
  const xs = () => (axis.by === 'time' ? ride.t : ride.dist);
  let cursor = null, track = null;
  const summary = (p) => `avg ${fixed(mean(ride[p.key]))} · max ${fixed(peak(ride[p.key]))}`;
  const paint = () => {
    for (const p of panels) {
      p.cols = lineChart(p.node, xs(), ride[p.key], p.color, p.floor);
      if (cursor != null) {
        paintCursor(p.node, cursor);
        const v = p.cols[Math.min(p.cols.length - 1, Math.round(cursor * (p.cols.length - 1)))];
        p.read.textContent = fixed(v);
      } else p.read.textContent = summary(p);
    }
    const x = xs(), end = x[x.length - 1];
    const label = (f) => (axis.by === 'time' ? duration(Math.round(end * f)) : `${(end * f).toFixed(1)} km`);
    left.textContent = label(0); mid.textContent = label(.5); right.textContent = label(1);
    if (track) track.mark(cursor == null ? null : Math.round(cursor * (ride.n - 1)));
  };
  const move = (event) => {
    const box = panels[0].node.getBoundingClientRect();
    const point = event.touches ? event.touches[0] : event;
    // The cursor is a fraction of the axis; the track reads it by record order.
    cursor = Math.max(0, Math.min(1, (point.clientX - box.left) / box.width));
    const x = xs(), target = x[0] + cursor * (x[x.length - 1] - x[0]);
    let i = 0;
    while (i + 1 < ride.n && x[i] < target) i++;
    paint(); if (track) track.mark(i);
  };
  const seg = el('div', { class: 'seg' }, ['time', 'distance'].map((by) => el('button', {
    type: 'button', class: by === axis.by ? 'on' : '',
    onclick: (event) => {
      axis.by = by; cursor = null;
      for (const b of seg.children) b.classList.toggle('on', b === event.currentTarget);
      paint();
    },
  }, by === 'time' ? 'Time' : 'Distance')));
  cards.push(el('div', { class: 'row', style: 'justify-content:space-between;margin:10px 0 8px' }, el('span', { class: 'caption' }, 'Ride'), seg));
  for (const p of panels) {
    for (const name of ['pointerdown', 'pointermove']) p.node.addEventListener(name, move);
    p.node.addEventListener('pointerleave', () => { cursor = null; paint(); });
    cards.push(p.box);
  }
  if (panels.length) cards.push(el('div', { class: 'axis' }, left, mid, right));
  if (!finite(ride.altitude).length && panels.length) cards.push(el('div', { class: 'note' }, 'This ride has no altitude. Grade is shown instead.'));

  if (hasPower) {
    const curve = powerCurve(watts), node = el('canvas', {});
    cards.push(el('div', { class: 'card' }, el('div', { class: 'caption' }, 'Power curve · best average W'), node));
    cards.curve = () => curveChart(node, curve, ftp);
    cards.push(el('div', { class: 'note' }, curve.map(([s, v]) => `${s < 60 ? s + ' s' : s / 60 + ' min'} ${Math.round(v)} W`).join(' · ')));
  }
  if (hasPower && ftp) cards.push(zoneCard('Time in power zones', zoneSeconds(ride.power, POWER_ZONES, ftp),
    ['Z1 Recovery', 'Z2 Endurance', 'Z3 Tempo', 'Z4 Threshold', 'Z5 VO2 max', 'Z6 Anaerobic', 'Z7 Sprint'], ZONE_COLORS));
  if (finite(ride.heart).length && lthr) cards.push(zoneCard('Time in heart zones', zoneSeconds(ride.heart, HEART_ZONES, lthr),
    ['Z1 Recovery', 'Z2 Endurance', 'Z3 Tempo', 'Z4 Threshold', 'Z5 Max'], ZONE_COLORS.slice(0, 5)));
  track = trackSvg(ride);
  if (track) cards.push(el('div', { class: 'card' }, el('div', { class: 'caption' }, 'Track'), track));

  root.replaceChildren(el('a', { class: 'back', href: '#/' }, '‹ Rides'), ...cards);
  paint();
  cards.curve?.();
  addEventListener('resize', () => { if (location.hash === `#/ride/${id}`) { paint(); cards.curve?.(); } });
}

let rides = [];
async function load() {
  try {
    // One request at a time: the device serves one connection.
    const status = await api('/api/status');
    const list = await api('/api/activities');
    profile = status;
    const battery = status.battery == null ? '' : `Battery ${status.battery}%`;
    $('status').replaceChildren(el('span', {}, `FTP ${status.ftp} W`), el('span', {}, battery));
    rides = list.activities;
    if (location.hash.startsWith('#/ride/')) return route();
    $('list').replaceChildren(...(rides.length ? rides.map(rideCard)
      : [el('div', { class: 'empty caption' }, list.indexing ? 'Reading rides…' : 'No rides yet')]));
    $('foot').textContent = list.indexing ? 'Reading rides…' : `${rides.length} rides`;
    if (list.indexing || status.indexing) setTimeout(load, 700);
  } catch (error) {
    $('status').replaceChildren(el('span', { class: 'alert' }, error.message));
  }
}

let showing = '';
function route() {
  const match = /^#\/ride\/(.+)$/.exec(location.hash);
  if (match) { showing = match[1]; showRide(decodeURIComponent(match[1])); } else if (showing) { showing = ''; load(); }
}
addEventListener('hashchange', route);

$('done').addEventListener('click', async () => {
  try { await api('/api/close', { method: 'POST' }); } catch {}
  document.body.replaceChildren(el('h1', {}, 'VANA'), el('div', { class: 'note' }, 'Disconnected. You can leave this Wi-Fi now.'));
});

load();
</script>
