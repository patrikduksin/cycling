[package]
name = "c606-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
bulk-maintenance = []
scripted-gnss = []
hardware = ["dep:esp-hal", "dep:esp32s3", "dep:esp-backtrace", "dep:esp-println", "dep:esp-bootloader-esp-idf", "dep:esp-radio", "dep:esp-rtos", "dep:esp-alloc", "dep:esp-storage", "dep:embassy-executor", "dep:embassy-net", "dep:embassy-time", "dep:embassy-sync", "dep:static_cell", "dep:embassy-futures", "dep:critical-section", "dep:trouble-host", "dep:bt-hci", "dep:rtos-trace"]


[dependencies]
log = { version = "=0.4.35", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde-json-core = { version = "=0.7.0", default-features = false }
libm = "0.2.16"
heapless.workspace = true
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable"], optional = true }
esp32s3 = { version = "=0.37.0", optional = true }
esp-backtrace = { version = "0.20.0", default-features = false, features = ["esp32s3", "println"], optional = true }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "jtag-serial", "critical-section"], optional = true }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"], optional = true }

esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "wifi", "ble", "coex", "unstable"], optional = true }
esp-rtos = { version = "=0.4.0", features = ["esp32s3", "esp-radio", "embassy", "rtos-trace"], optional = true }
rtos-trace = { version = "0.2.1", optional = true }
esp-alloc = { version = "0.11.0", features = ["esp32s3"], optional = true }
esp-storage = { version = "=0.10.0", features = ["esp32s3"], optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embassy-executor = { version = "0.10.0", features = ["trace"], optional = true }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns", "auto-icmp-echo-reply"], optional = true }
embassy-time = { version = "0.5.0", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
static_cell = { version = "2.1.1", optional = true }
critical-section = { version = "1.2.0", optional = true }
trouble-host = { version = "=0.7.0", default-features = false, features = ["peripheral", "scan", "gatt", "derive", "default-packet-pool", "default-packet-pool-size-8", "default-packet-pool-mtu-128", "gatt-client-notification-max-subscribers-2", "gatt-client-notification-queue-size-2"], optional = true }
bt-hci = { version = "0.9", optional = true }


device-api = { path = "../../packages/device-api" }
firmware-services = { path = "../../packages/services" }
firmware-shell = { path = "../../packages/shell" }
firmware-console = { path = "../../packages/console" }
vana = { path = "../../apps/vana" }

# Host tests of the phone exchange run its async code on the std time driver.
[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-8"] }

[[bin]]
name = "cycling-os"
path = "src/main.rs"
required-features = ["hardware"]
