# every frame not named above it. Each budget is the measured frame plus
# max(1 KiB, 10%). A rule that matches nothing prints a warning: inlining
# can remove a function after unrelated edits. View::prepare, smooth and
# climb_frame sit under every frame VANA prepares, so their budgets are
# tighter than the catch-all on purpose. A failed build prints the command
# that suggests new budgets for its ELF.

