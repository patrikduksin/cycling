# The largest stack frame, in bytes, each firmware function may open, per
# build variant (sdk<CYCLING_SDK>-h<CYCLING_HARNESS>). build.sh reads the
# frames from the release ELF's `entry a1, N` prologues and fails on a frame
# over its budget. The first rule that matches a demangled name applies; `*`
# matches any text, and the last rule bounds every frame not named above it.
# Each budget is the measured frame plus max(1 KiB, 10%). Inlining differs
# by variant, so a function inlined away in one variant has no rule there; a
# rule that matches nothing prints a warning. View::prepare, smooth and
# climb_frame sit under every frame VANA prepares, so their budgets are
# tighter than the catch-all on purpose. A failed build prints the command
# that suggests new budgets for its ELF.

