[tools]
rust = { version = "1.98.1", components = ["rustfmt", "clippy"] }
python = "3.14.7"
uv = "0.12.10"
"github:esp-rs/espup" = "0.17.1"
"github:esp-rs/espflash" = "4.5.0"

[tasks.setup]
description = "Install the pinned Xtensa Rust toolchain"
run = "mkdir -p .local && espup install --targets esp32s3 --toolchain-version 1.97.0.0 --name cycling-esp --export-file .local/export-esp.sh"

[tasks.build]
description = "Build C606 firmware and its application image"
run = "bash scripts/build.sh"

[tasks.test]
description = "Test host firmware logic and device tools"
run = ["cargo test --workspace --locked --no-default-features", "cargo test --workspace --locked --no-default-features --features cycling", "cargo test --manifest-path packages/os/vendor/trouble-host/Cargo.toml --lib --locked", "python -m unittest discover -s scripts -p 'test_*.py'"]

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.check]
description = "Check formatting and lint host code"
run = ["python scripts/check_boundaries.py", "cargo fmt --all -- --check", "cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings", "cargo clippy --workspace --all-targets --locked --no-default-features --features cycling -- -D warnings"]


[tasks.backup]
description = "Read and verify a private full-flash backup from stock"
run = "uv run scripts/device.py backup"

[tasks.flash]
description = "Verify stock, flash cycling to slot B, and boot it"
depends = ["build"]
run = "uv run scripts/device.py flash"

[tasks.stock]
description = "Verify and boot preserved stock firmware"
run = "uv run scripts/device.py stock"

[tasks.monitor]
description = "Read USB logs without resetting the device"
run = "uv run scripts/device.py monitor"

[tasks.wifi-setup]
description = "Save current NetworkManager Wi-Fi credentials privately"
run = "python scripts/wifi.py setup"







[tasks.ride-export]
description = "Export the complete read-only ride prefix as private raw, JSON and GPX files"
run = "python scripts/export_rides.py"

[tasks.ride-clear]
description = "Clear the owned ride journal after verifying a named complete export"
run = "python scripts/clear_rides.py"

[tasks.gps-stress]
description = "Check GNSS progress and transport counters under repeated USB state replies"
run = "python scripts/gps_stress.py .local/tests/gps-stress-$(date +%s) --require-no-loss"

[tasks.companion-stress]
description = "Check companion progress and transport counters under repeated USB state replies"
run = "python scripts/companion_stress.py .local/tests/companion-stress-$(date +%s)"

[tasks.bluetooth-echo]
description = "Verify C606 BLE echo notifications, reads and reconnect with this laptop"
run = "/usr/bin/python3 scripts/bluetooth.py"

[tasks.ble-simulator]
description = "Advertise deterministic HRS and CSC fixtures from this laptop"
run = "/usr/bin/python3 scripts/ble_sensor_sim.py"

[tasks.logs]
description = "Capture private JSON logs without resetting; send optional commands once"
run = "python scripts/logs.py"

[tasks.terminal]
description = "Send ordinary commands with --command TEXT and capture correlated replies"
run = "python scripts/logs.py"

[tasks.e2e]
description = "Verify terminal framing, repeated no-reset opens and independent acquisition"
run = "python scripts/base_test.py .local/tests/base-$(date +%s)"

[tasks.persistence-test]
description = "Save a temporary brightness, restart, verify and restore original preferences"
run = "python scripts/base_test.py .local/tests/persistence-$(date +%s) --write-settings --restart"

[tasks.regression]
description = "Run a 60-second no-render terminal and acquisition regression"
run = "python scripts/base_test.py .local/tests/regression-$(date +%s) --seconds 60"

[tasks.crash-test]
description = "Verify controlled panic, software reboot and one-shot marker through ordinary terminal"
run = "python scripts/base_test.py .local/tests/crash-$(date +%s) --panic"
