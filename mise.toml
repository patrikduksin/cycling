[tools]
rust = { version = "1.98.1", components = ["rustfmt", "clippy"] }
python = "3.14.7"
uv = "0.12.10"
"github:esp-rs/espup" = "0.17.1"
"github:esp-rs/espflash" = "4.5.0"

[tasks.setup]
description = "Install the pinned Xtensa Rust toolchain"
run = "mkdir -p .local && espup install --targets esp32s3 --toolchain-version 1.97.0.0 --name cycling-esp --export-file .local/export-esp.sh"

[tasks.build]
description = "Build C606 firmware and its application image"
run = "bash scripts/build.sh"

[tasks.test]
description = "Test host firmware logic and device tools"
run = ["cargo test --workspace --locked", "cargo test --manifest-path packages/os/vendor/trouble-host/Cargo.toml --lib --locked", "python -m unittest discover -s scripts -p 'test_*.py'"]

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.check]
description = "Check formatting and lint host code"
run = ["cargo fmt --all -- --check", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks.preview]
description = "Render a frame without a device"
run = "mkdir -p .local && cargo run --locked --example preview -- .local/controls.ppm"

[tasks.backup]
description = "Read and verify a private full-flash backup from stock"
run = "uv run scripts/device.py backup"

[tasks.flash]
description = "Verify stock, flash cycling to slot B, and boot it"
depends = ["build"]
run = "uv run scripts/device.py flash"

[tasks.stock]
description = "Verify and boot preserved stock firmware"
run = "uv run scripts/device.py stock"

[tasks.monitor]
description = "Read USB logs without resetting the device"
run = "uv run scripts/device.py monitor"

[tasks.wifi-setup]
description = "Save current NetworkManager Wi-Fi credentials privately"
run = "python scripts/wifi.py setup"

[tasks.screenshot]
description = "Capture the device screen as a private PNG over USB"
run = "python scripts/screenshot.py"

[tasks.debug]
description = "Inspect, record, and exercise the running device over USB"
run = "python scripts/debug.py"

[tasks.e2e]
description = "Run device UI and Wi-Fi recovery tests and save visual evidence"
run = "python scripts/debug.py smoke"

[tasks.persistence-test]
description = "Verify preferences across temporary sessions and safe reflashes"
run = "python scripts/persistence_test.py"

[tasks.regression]
description = "Run device scenarios, restart checks, visual comparisons and stability soak"
run = "python scripts/regression.py"

[tasks.crash-test]
description = "Trigger a controlled panic and verify one-shot reset diagnostics"
run = "python scripts/debug.py crash-test"

[tasks.ride-export]
description = "Export the complete read-only ride prefix as private raw, JSON and GPX files"
run = "python scripts/export_rides.py"

[tasks.gps-stress]
description = "Check GNSS progress and transport counters under repeated USB state replies"
run = "python scripts/gps_stress.py .local/tests/gps-stress --require-no-loss"

[tasks.bluetooth-echo]
description = "Verify C606 BLE echo notifications, reads and reconnect with this laptop"
run = "/usr/bin/python3 scripts/bluetooth.py"

[tasks.ble-simulator]
description = "Advertise deterministic HRS and CSC fixtures from this laptop"
run = "/usr/bin/python3 scripts/ble_sensor_sim.py"
