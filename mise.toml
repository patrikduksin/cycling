# mise runs tasks only. Tool versions live in flake.nix/flake.lock and reach
# every task through the dev shell (direnv or `nix develop`).

[env]
# Never let an ambient or parent-config PYTHONPATH shadow the locked uv environment.
PYTHONPATH = false

[vars]
# Every host Python tool runs in the locked tools/devtools uv environment.
devtools = "uv run --project tools/devtools --locked"
# The terrain pack builder has its own environment (osmium, numpy, tifffile).
terrain = "uv run --project tools/terrain --locked"

[tasks.build]
description = "Build C606 firmware and its application image"
run = "bash devices/c606/build.sh"

[tasks.test]
description = "Test host firmware logic and device tools"
depends = ["test-rust", "test-python"]

[tasks.test-rust]
description = "Rust host tests (one target dir, so the passes run in turn)"
run = ["cargo test --workspace --locked --no-default-features", "cargo test -p shell-simulator --locked --no-default-features --features debug-harness", "cargo test --workspace --locked --no-default-features --features shell-simulator/debug-harness,shell-simulator/cycling", "cargo test --manifest-path vendor/trouble-host/Cargo.toml --lib --locked"]

[tasks.test-python]
description = "Device tool and terrain tests, spread over worker processes"
run = ["{{vars.devtools}} pytest -q -n auto --maxprocesses=8 tools/devtools", "{{vars.terrain}} pytest -q tools/terrain"]

[tasks.stack-frames]
description = "Report a firmware ELF's largest stack frames against devices/c606/stack-frames.toml; --suggest prints new budgets"
run = "{{vars.devtools}} python -m cycling_devtools.stack_frames"

[tasks.verify]
description = "Run every PR gate in parallel (test, check, simulate, 4 builds, harness-virtual); --fast for the inner loop, --pr N to post results"
run = "{{vars.devtools}} python -m cycling_devtools.verify"

[tasks.clean]
description = "Free disk: remove merged, clean, idle worktrees and idle build dirs; dry run unless --apply, --idle-hours N (default 24)"
run = "{{vars.devtools}} python -m cycling_devtools.clean"

[tasks.fmt]
description = "Format Rust and Python code"
run = ["cargo fmt --all", "{{vars.devtools}} ruff format tools/devtools", "{{vars.terrain}} ruff format tools/terrain"]

[tasks.check]
description = "Check formatting and lint host code"
run = ["uv run --script tools/check-boundaries.py", "uv run --script apps/vana/web/build.py --check", "{{vars.devtools}} ruff format --check tools/devtools", "{{vars.devtools}} ruff check tools/devtools", "{{vars.terrain}} ruff format --check tools/terrain", "{{vars.terrain}} ruff check tools/terrain", "cargo check -p device-api --locked --features network-stack", "cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings", "cargo clippy --workspace --all-targets --locked --no-default-features --features shell-simulator/debug-harness,shell-simulator/cycling,shell-simulator/live -- -D warnings", "cargo fmt --all -- --check"]

[tasks.terrain]
description = "Build, validate or trace offline terrain packs (docs/terrain.md)"
run = "{{vars.terrain}} cycling-terrain"

[tasks.web]
description = "Build the phone web client the device serves (apps/vana/web)"
run = "uv run --script apps/vana/web/build.py"

[tasks.backup]
description = "Read and verify a private full-flash backup from stock"
run = "{{vars.devtools}} python -m cycling_devtools.device.firmware backup"

[tasks.flash]
description = "Flash cycling into the inactive A/B slot, boot it, and reselect the old slot if its console stays silent"
depends = ["build"]
run = "{{vars.devtools}} python -m cycling_devtools.device.firmware flash"

[tasks.flash-image]
description = "Flash the already built .local/cycling.bin like flash does, without building (device hosts receive images)"
run = "{{vars.devtools}} python -m cycling_devtools.device.firmware flash"

[tasks.device]
description = "Run a device task on CYCLING_DEVICE_HOST, the machine with the C606 (device flash builds here, flashes there)"
run = "{{vars.devtools}} python -m cycling_devtools.device.remote"

[tasks.rollback]
description = "Boot the previous cycling image in the other A/B slot after validating it"
run = "{{vars.devtools}} python -m cycling_devtools.device.firmware rollback"

[tasks.stock]
description = "Restore the complete verified 16 MiB stock backup (confirmation required; saves cycling rides/settings first)"
run = "{{vars.devtools}} python -m cycling_devtools.device.firmware stock"

[tasks.restore-owned]
description = "Write a saved ride/settings snapshot back under running cycling firmware, with verified readback"
run = "{{vars.devtools}} python -m cycling_devtools.device.firmware restore-owned"

[tasks.stock-select]
alias = "boot-stock"
description = "Boot stock in slot A without rewriting flash, while slot A still holds the verified stock image"
run = "{{vars.devtools}} python -m cycling_devtools.device.firmware stock-select"

[tasks.monitor]
description = "Read USB logs without resetting the device"
run = "{{vars.devtools}} python -m cycling_devtools.device.firmware monitor"

[tasks.wifi-setup]
description = "Save current NetworkManager Wi-Fi credentials privately"
run = "{{vars.devtools}} python -m cycling_devtools.connectivity.wifi setup"

[tasks.ride-export]
description = "Export the complete read-only ride prefix as private raw, JSON and GPX files"
run = "{{vars.devtools}} python -m cycling_devtools.rides.export"

[tasks.ride-clear]
description = "Clear the owned ride journal after verifying a named complete export"
run = "{{vars.devtools}} python -m cycling_devtools.rides.clear"

[tasks.workout-load]
description = "Put a workout JSON file on the device's FILES volume for the workout picker (--dry-run prints the file)"
run = "{{vars.devtools}} python -m cycling_devtools.workouts.load"

[tasks.gps-stress]
description = "Check GNSS progress and transport counters under repeated USB state replies"
run = "{{vars.devtools}} python -m cycling_devtools.harness.stress gps .local/tests/gps-stress-$(date +%s)"

[tasks.companion-stress]
description = "Check companion progress and transport counters under repeated USB state replies"
run = "{{vars.devtools}} python -m cycling_devtools.harness.stress companion .local/tests/companion-stress-$(date +%s)"

[tasks.bluetooth-echo]
description = "Verify C606 BLE echo notifications, reads and reconnect with this laptop"
# BlueZ tools need the distribution's D-Bus and GLib bindings, which only the
# system Python provides; they use the source tree instead of the uv environment.
env = { PYTHONPATH = "{{config_root}}/tools/devtools/src" }
run = "/usr/bin/python3 -m cycling_devtools.connectivity.bluetooth"

[tasks.ble-simulator]
description = "Advertise deterministic HRS and CSC fixtures from this laptop"
# System Python for D-Bus and GLib bindings; see bluetooth-echo.
env = { PYTHONPATH = "{{config_root}}/tools/devtools/src" }
run = "/usr/bin/python3 -m cycling_devtools.connectivity.ble_sensor_sim"

[tasks.logs]
description = "Capture private JSON logs without resetting; send optional commands once"
run = "{{vars.devtools}} python -m cycling_devtools.terminal.logs"

[tasks.backtrace]
description = "Decode code addresses in device logs (files or stdin) against .local/cycling.elf"
run = "{{vars.devtools}} python -m cycling_devtools.terminal.backtrace"

[tasks.terminal]
description = "Run a command or open the interactive no-reset USB terminal"
run = "{{vars.devtools}} python -m cycling_devtools.terminal.cli"

[tasks.e2e]
description = "Verify terminal framing, repeated no-reset opens and independent acquisition"
run = "{{vars.devtools}} python -m cycling_devtools.harness.base .local/tests/base-$(date +%s)"

[tasks.persistence-test]
description = "Save a temporary brightness, restart, verify and restore original preferences"
run = "{{vars.devtools}} python -m cycling_devtools.harness.base .local/tests/persistence-$(date +%s) --write-settings --restart"

[tasks.regression]
description = "Run a 60-second no-render terminal and acquisition regression"
run = "{{vars.devtools}} python -m cycling_devtools.harness.base .local/tests/regression-$(date +%s) --seconds 60"

[tasks.crash-test]
description = "Verify controlled panic, software reboot and one-shot marker through ordinary terminal"
run = "{{vars.devtools}} python -m cycling_devtools.harness.base .local/tests/crash-$(date +%s) --panic"

[tasks.ant-export]
description = "Decode historical ANT captures from a raw journal file into a private directory"
run = "{{vars.devtools}} python -m cycling_devtools.rides.ant_capture"

[tasks.simulate]
description = "Run the portable shell against deterministic display and input devices"
run = "cargo run -p shell-simulator --locked --no-default-features --bin shell-simulator"

[tasks.sim]
description = "Run VANA scenarios in the simulated world; report and artifacts go to .local/sim/latest"
run = [
  "rm -rf .local/sim/latest && mkdir -p .local/sim/latest",
  "SIM_ARTIFACTS=$PWD/.local/sim/latest cargo test -p shell-simulator --locked --no-default-features --features cycling,debug-harness --test ride_scenarios 2>&1 | tee .local/sim/latest/cargo.log || true",
  "{{vars.devtools}} python -m cycling_devtools.sim.report .local/sim/latest",
]

[tasks.sim-pr]
description = "Run simulator scenarios and post their videos and screenshots inline on a pull request"
usage = 'arg "<pr>" help="pull request number"'
run = [
  "rm -rf .local/sim/pr && mkdir -p .local/sim/pr",
  "SIM_ARTIFACTS=$PWD/.local/sim/pr cargo test -p shell-simulator --locked --no-default-features --features cycling,debug-harness --test ride_scenarios 2>&1 | tee .local/sim/pr/cargo.log || true",
  "{{vars.devtools}} python -m cycling_devtools.sim.report .local/sim/pr --pr \"${usage_pr}\"",
]

[tasks.sim-compare]
description = "Run simulator scenarios here and on a base ref; report changed screens Before | After, optionally on a pull request"
usage = '''
flag "--base <ref>" help="git ref to compare against (default: origin/main, fetched first)"
flag "--pr <pr>" help="pull request to comment on"
flag "--filter <name>" help="cargo test name filter, applied to both runs"
'''
run = '{{vars.devtools}} python -m cycling_devtools.sim.compare ${usage_base:+--base "$usage_base"} ${usage_pr:+--pr "$usage_pr"} ${usage_filter:+--filter "$usage_filter"}'

[tasks.sim-live]
description = "Open a window onto the simulated device; the session is recorded to .local/sim/live"
run = "SIM_ARTIFACTS=$PWD/.local/sim/live cargo run -p shell-simulator --locked --no-default-features --features cycling,debug-harness,live --bin sim-live"

[tasks.harness]
description = "Run a named or structured C606/virtual harness scenario and return compact JSON"
run = "{{vars.devtools}} python -m cycling_devtools.harness.runner"

[tasks.screenshot]
description = "Save the next frame pushed to the C606 panel as a PNG (harness builds); --scale 2, --press BUTTON"
run = "{{vars.devtools}} python -m cycling_devtools.harness.screenshot"

[tasks.latency]
description = "Time button press to finished frame on the C606 and the idle frame rate (harness builds); --press, --setup"
run = "{{vars.devtools}} python -m cycling_devtools.harness.latency"

[tasks.startup-timing]
description = "Measure power-on to first frame, Home, storage, GNSS, sensors, ride start and press latency (C606, or --sim)"
run = "{{vars.devtools}} python -m cycling_devtools.harness.startup_timing"

[tasks.harness-virtual]
description = "Run shared deterministic input, capture and restart scenarios"
run = ["{{vars.devtools}} python -m cycling_devtools.harness.runner run shared --backend virtual", "{{vars.devtools}} python -m cycling_devtools.harness.runner run virtual-foundation --backend virtual", "{{vars.devtools}} python -m cycling_devtools.harness.runner run virtual-sdk --backend virtual --sdk"]

[tasks.mmc-inspect]
description = "Read bounded MMC layout and root metadata into private local evidence"
run = "{{vars.devtools}} python -m cycling_devtools.device.mmc"

[tasks.volumes]
description = "Inspect the MMC volume table, terrain pack and file store (inspect|init|terrain-write|terrain-verify|files)"
run = "{{vars.devtools}} python -m cycling_devtools.device.volumes"

[tasks.terrain-write]
description = "Install a terrain pack file into the MMC TERRAIN volume, resumable, with --verify readback"
run = "{{vars.devtools}} python -m cycling_devtools.device.volumes terrain-write"

[tasks.terrain-verify]
description = "Compare the installed TERRAIN pack with a file, chunk by chunk on the device"
run = "{{vars.devtools}} python -m cycling_devtools.device.volumes terrain-verify"

[tasks.files]
description = "List, put, get, delete or format files in the MMC FILES store (list|put name path|get name path|delete name|format --confirm)"
run = "{{vars.devtools}} python -m cycling_devtools.device.volumes files"

[tasks.mmc-maintenance]
description = "Back up or explicitly write MMC using the dedicated maintenance image"
run = "{{vars.devtools}} python -m cycling_devtools.device.mmc_maintenance"

[tasks.device-port]
description = "Resolve the backed-up C606's current USB port without opening it"
run = "{{vars.devtools}} python -m cycling_devtools.device.port"
