[package]
name = "cycling-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
debug-harness = []
c606 = ["dep:esp-hal", "dep:esp-backtrace", "dep:esp-println", "dep:esp-bootloader-esp-idf", "dep:esp-radio", "dep:esp-rtos", "dep:esp-alloc", "dep:esp-storage", "dep:embedded-storage", "dep:embassy-executor", "dep:embassy-net", "dep:embassy-time", "dep:embassy-sync", "dep:static_cell", "dep:embassy-futures", "dep:critical-section", "dep:trouble-host", "dep:bt-hci"]

[dependencies]
libm = "0.2.16"
esp-hal = { version = "=1.1.2", features = ["esp32s3", "unstable"], optional = true }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println", "custom-pre-backtrace", "custom-halt"], optional = true }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "jtag-serial", "critical-section"], optional = true }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"], optional = true }

esp-radio = { version = "=1.0.0-beta.0", features = ["esp32s3", "wifi", "ble", "coex", "unstable"], optional = true }
esp-rtos = { version = "=0.3.0", features = ["esp32s3", "esp-radio", "embassy"], optional = true }
esp-alloc = { version = "0.10.0", features = ["esp32s3"], optional = true }
esp-storage = { version = "=0.9.0", features = ["esp32s3"], optional = true }
embedded-storage = { version = "0.3.1", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embassy-executor = { version = "0.10.0", optional = true }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns", "auto-icmp-echo-reply"], optional = true }
embassy-time = { version = "0.5.0", optional = true }
embassy-sync = { version = "0.7.0", optional = true }
static_cell = { version = "2.1.1", optional = true }
critical-section = { version = "1.2.0", optional = true }
trouble-host = { version = "=0.6.0", default-features = false, features = ["peripheral", "scan", "gatt", "derive", "default-packet-pool", "default-packet-pool-size-4", "default-packet-pool-mtu-64", "gatt-client-notification-max-subscribers-2", "gatt-client-notification-queue-size-2"], optional = true }
bt-hci = { version = "0.8", optional = true }

[[bin]]
name = "cycling-os"
path = "src/main.rs"
required-features = ["c606"]

[[example]]
name = "preview"
path = "examples/preview.rs"
