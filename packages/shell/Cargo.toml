[package]
name = "firmware-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
std = []
# Count painter work for the host render benchmark (`rendering::work`).
work-counters = ["std"]
# Record how each painted pixel was written, for the light look check (`rendering::record`).
paint-record = ["std"]

[dependencies]
device-api = { path = "../device-api" }
firmware-services = { path = "../services" }
heapless.workspace = true
log = { version = "=0.4.35", default-features = false }

[dev-dependencies]
firmware-services = { path = "../services", features = ["testing"] }
