[package]
name = "firmware-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
debug-harness = []
std = []
# Count painter work for the host render benchmark (`rendering::work`).
work-counters = ["std"]

[dependencies]
device-api = { path = "../device-api" }
firmware-services = { path = "../services" }
heapless.workspace = true
log = { version = "=0.4.34", default-features = false }

[dev-dependencies]
firmware-services = { path = "../services", features = ["testing"] }
