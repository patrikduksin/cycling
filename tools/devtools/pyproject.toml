[project]
name = "cycling-devtools"
version = "0.1.0"
description = "Host tools for cycling firmware development"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["esptool==5.4.0"]

[dependency-groups]
dev = [
    "fitdecode==0.11.0",
    "garmin-fit-sdk==21.218.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The formatter owns wrapping; long operator-facing messages stay greppable.
    "E501",
    # Explicit try/except keeps a comment beside each deliberately absorbed error.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Tests nest context managers for readability, define fakes called within the
# same loop iteration, and share recorded state through fake class attributes.
"tests/*" = ["SIM117", "B023", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["cycling_devtools", "workspace_fixture"]
