[project]
name = "cycling-devtools"
version = "0.1.0"
description = "Host tools for cycling firmware development"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["esptool==5.4.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cycling_devtools", "workspace_fixture"]
