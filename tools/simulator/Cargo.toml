[package]
name = "shell-simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
live = ["dep:minifb"]
planted-bug = ["vana/planted-bug"]

[dependencies]
device-api = { path = "../../packages/device-api" }
firmware-services = { path = "../../packages/services", features = ["testing"] }
firmware-shell = { path = "../../packages/shell", features = ["std", "work-counters"] }
firmware-console = { path = "../../packages/console" }
vana = { path = "../../apps/vana", features = ["invariants"] }
log = { version = "=0.4.35", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde-json-core = { version = "=0.7.0", default-features = false }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
png = "=0.18.1"
flate2 = "=1.1.11"
fdeflate = "=0.3.7"
gif = "=0.14.2"
sha2 = { version = "=0.11.1", default-features = false }
# Window for `sim-live`; X11 and Wayland libraries are loaded at run time.
minifb = { version = "=0.29.0", optional = true }

[[bin]]
name = "sim-bench"
path = "src/bin/sim-bench.rs"

[[bin]]
name = "redraw-probe"
path = "src/bin/redraw-probe.rs"

[[bin]]
name = "trace"
path = "src/bin/trace.rs"

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"

[[bin]]
name = "sim-live"
path = "src/bin/sim-live.rs"
required-features = ["live"]

[dev-dependencies]
# Reads the Connect phone QR codes back from rendered frames.
rqrr = "=0.11.0"
terrain = { path = "../../packages/terrain" }
firmware-shell = { path = "../../packages/shell", features = ["paint-record"] }
vana = { path = "../../apps/vana", features = ["testing"] }
