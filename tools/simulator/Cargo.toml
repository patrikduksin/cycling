[package]
name = "shell-simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
cycling = ["dep:vana", "firmware-console/cycling"]
debug-harness = ["firmware-shell/debug-harness", "firmware-console/debug-harness"]
live = ["cycling", "dep:minifb"]

[dependencies]
device-api = { path = "../../packages/device-api" }
firmware-services = { path = "../../packages/services" }
firmware-shell = { path = "../../packages/shell", features = ["std", "work-counters"] }
firmware-console = { path = "../../packages/console" }
vana = { path = "../../apps/vana", optional = true }
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde-json-core = { version = "=0.6.0", default-features = false }
png = "=0.18.1"
gif = "=0.14.2"
# Window for `sim-live`; X11 and Wayland libraries are loaded at run time.
minifb = { version = "=0.29.0", optional = true }

[[bin]]
name = "sim-bench"
path = "src/bin/sim-bench.rs"
required-features = ["cycling"]

[[bin]]
name = "sim-live"
path = "src/bin/sim-live.rs"
required-features = ["cycling", "live"]

[dev-dependencies]
# Reads the Connect phone QR codes back from rendered frames.
rqrr = "=0.11.0"
