[device]
name = "small"
product = "VANA SMALL"
fit_product = 0

[panel]
width = 180
height = 240

[controls]
touch = true
buttons = [
  { id = 0, role = "back", edge = "left", at = 250 },
  { id = 1, role = "move", edge = "left", at = 750 },
  { id = 2, role = "act", edge = "right", at = 750 },
]

[fitted]
gps = true
ant = true
ble = true
wifi = true
sound = true
shutdown = true
card = true
barometer = true
light = true
