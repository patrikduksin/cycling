[device]
name = "volatile"
product = "VANA VOLATILE"
fit_product = 0

[panel]
width = 240
height = 320

[controls]
touch = true
buttons = [
  { id = 0, role = "back", edge = "left", at = 250 },
  { id = 1, role = "move", edge = "bottom", at = 217 },
  { id = 2, role = "act", edge = "bottom", at = 783 },
]

[owned]
data = { memory = "psram", size = 0x40000 }
configuration = { memory = "ram", size = 0x2000 }

[fitted]
gps = true
ant = true
ble = true
wifi = true
sound = true
shutdown = true
card = true
barometer = true
light = true
